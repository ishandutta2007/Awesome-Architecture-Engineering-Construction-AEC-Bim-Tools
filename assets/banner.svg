<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="wireframeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatBeam {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes scanline {
        0% { transform: translateY(-60px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(120px); opacity: 0; }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      .pulsing-orb {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .floating-geom {
        animation: floatBeam 8s ease-in-out infinite;
        transform-origin: center;
      }
      .laser-scan {
        animation: scanline 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .wire-dash {
        stroke-dasharray: 8, 4;
        animation: dashAnim 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Glowing Background Orbs (Non-obstructive) -->
  <circle cx="150" cy="100" r="140" fill="#06b6d4" opacity="0.15" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="1050" cy="300" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" class="pulsing-orb" style="animation-delay: -3s;" />
  <circle cx="980" cy="90" r="100" fill="#3b82f6" opacity="0.15" filter="url(#glow)" class="pulsing-orb" style="animation-delay: -1.5s;" />

  <!-- Subtle AEC Isometric / Wireframe 3D BIM Elements (Positioned on the flanks & background) -->
  <g class="floating-geom" opacity="0.45">
    <!-- Left Flank: Structural Wireframe Grid & Truss -->
    <path d="M 50 360 L 160 300 L 270 360 L 160 420 Z" fill="none" stroke="#06b6d4" stroke-width="1.5" class="wire-dash" />
    <path d="M 160 300 L 160 180 M 50 360 L 50 240 M 270 360 L 270 240" stroke="#3b82f6" stroke-width="1.2" />
    <path d="M 50 240 L 160 180 L 270 240 L 160 300 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="50" y1="240" x2="270" y2="360" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="270" y1="240" x2="50" y2="360" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.4" />
  </g>

  <g class="floating-geom" style="animation-delay: -4s;" opacity="0.45">
    <!-- Right Flank: Parametric Building Mass & IFC Coordination Node -->
    <polygon points="1020,80 1140,140 1140,280 1020,220" fill="url(#wireframeGrad)" stroke="#8b5cf6" stroke-width="1.5" />
    <polygon points="900,140 1020,80 1020,220 900,280" fill="#1e1b4b" fill-opacity="0.3" stroke="#6366f1" stroke-width="1.5" />
    <polygon points="900,140 1020,80 1140,140 1020,200" fill="#312e81" fill-opacity="0.4" stroke="#a855f7" stroke-width="1.5" />
    <!-- Dynamic Clash Detection Ring / Scanner -->
    <ellipse cx="1020" cy="180" rx="90" ry="40" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="6,4" class="laser-scan" />
  </g>

  <!-- Central Foreground Content (Unobscured & Crystal Clear) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Super-category Eyebrow Pill -->
    <rect x="-170" y="-85" width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="url(#accentGrad)" stroke-width="1.2" />
    <text x="0" y="-64" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">AEC SOFTWARE &amp; OPENBIM ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="-6" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">Awesome AEC &amp; BIM Tools</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
      Curated Architecture, Engineering &amp; Construction Software, Cloud CDEs &amp; OpenBIM IFC Tools
    </text>

    <!-- Interactive / Status Pills in Banner -->
    <g transform="translate(0, 80)">
      <!-- Pill 1 -->
      <g transform="translate(-270, 0)">
        <rect x="0" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="16" r="4" fill="#10b981" />
        <text x="32" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">OpenBIM &amp; IFC 4.3</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-85, 0)">
        <rect x="0" y="0" width="170" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="16" r="4" fill="#38bdf8" />
        <text x="32" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">3D Coordination &amp; CDE</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="165" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="16" r="4" fill="#a855f7" />
        <text x="32" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Clash Detection &amp; QA</text>
      </g>
    </g>

    <!-- Bottom Metadata Line -->
    <text x="0" y="160" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">
      ⚡ Updated November 2026 • Verified SaaS Starting Tiers • Open-Source Repositories Ranked by GitHub Stars
    </text>
  </g>

  <!-- Aesthetic Framing Accent Bars -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
